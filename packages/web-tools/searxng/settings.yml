use_default_settings: true
server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: "replaced-by-SEARXNG_SECRET-environment-variable"
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  default_lang: auto
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
redis:
  url: false
